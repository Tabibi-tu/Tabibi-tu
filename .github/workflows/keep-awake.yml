name: Keep Streamlit App Awake

on:
  schedule:
    # إرسال نبضة كل 6 ساعات لإبقاء التطبيق مستيقظاً
    - cron: '0 */6 * * *'
  workflow_dispatch: # يتيح لك تشغيل السكريبت يدوياً إذا أردت

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App Direct Link
        run: curl -I https://dr-tabibi.streamlit.app
