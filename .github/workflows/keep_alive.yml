name: Keep Streamlit App Alive

on:
  schedule:
    # يعمل تلقائياً كل 15 دقيقة
    - cron: '*/15 * * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً للتجربة

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        # إضافة -L لتتبع التحويلات، وتجاهل أي توقف مؤقت لمنع إرسال إيميلات الفشل
        run: |
          curl -L -s -k -m 20 -o /dev/null -w "Status: %{http_code}\n" https://tabibi-tu.streamlit.app || true
