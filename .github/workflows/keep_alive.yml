name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  wake-up-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Visit and Wake Up Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://dr-tabibi.streamlit.app', timeout=60000)
              page.wait_for_timeout(10000)
              button = page.locator('button:has-text(\"Yes, get this app back up\")')
              if button.is_visible():
                  button.click()
                  print('Clicked wake up button!')
                  page.wait_for_timeout(20000)
              else:
                  print('App is already awake and active!')
              browser.close()
          "
